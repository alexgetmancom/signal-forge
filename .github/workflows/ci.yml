name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: signal-forge:test

  deploy:
    name: Deploy to production
    needs: [check, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, signal-forge-production]
    timeout-minutes: 15
    concurrency:
      group: signal-forge-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and verify health
        env:
          DEPLOY_RELEASE: ${{ github.sha }}
        run: ./scripts/deploy.sh
