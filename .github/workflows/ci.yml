name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "Screenshots/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "Screenshots/**"
      - "*.md"

# A superseded pull request run is wasted work, but a superseded push to main is
# a release that must still reach production, so only pull requests cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/signal-forge

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
      - run: bun run check

  image:
    name: Build the release image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      # A pull request from a fork gets no package write access, so it builds
      # for validation only and never signs in.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: [check, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, signal-forge-production]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    concurrency:
      group: signal-forge-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy and verify health
        env:
          DEPLOY_RELEASE: ${{ github.sha }}
          # By digest, not by tag: the tag can move between the build and the
          # deployment, the digest names the bytes CI actually tested.
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}
        run: ./scripts/deploy.sh
