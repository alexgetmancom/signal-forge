services:
  app:
    build: .
    image: ${SIGNAL_FORGE_IMAGE:-signal-forge:latest}
    restart: unless-stopped
    mem_limit: 512m
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    env_file:
      - .env
    environment:
      BIND_HOST: 0.0.0.0
      DATABASE_URL: /app/data/app.db
      NODE_ENV: production
      PORT: 8080
    ports:
      - "${SIGNAL_FORGE_BIND_ADDRESS:-127.0.0.1}:18081:8080"
    volumes:
      - ./data:/app/data
      # The nightly backup verifies its own output from inside the container.
      - ./backups:/app/backups
      - ./signal-forge.json:/app/signal-forge.json:ro
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:8080/healthz").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      # start_period alone only forgives early failures -- it does not make the first probe happen
      # any sooner, so a container that was ready in a second still sat unprobed until the 30s
      # interval came round. Measured on release 406fd96: the deployment waited 70 seconds between
      # "Started" and "Healthy" for a probe that answers in 110 ms. start_interval is what governs
      # the spacing until the first success, and it is the whole reason a deploy takes minutes.
      start_interval: 2s
