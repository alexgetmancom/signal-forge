services:
  app:
    build: .
    image: ${SIGNAL_FORGE_IMAGE:-signal-forge:latest}
    restart: unless-stopped
    # A limit exists to make a regression loud rather than to be generous: what it buys is that the
    # next collector to hold a 230 MB body whole is a restart somebody sees, not a gigabyte nobody
    # notices. The peaks it is set against were 1,467 to 1,525 MB as recently as 2026-09-25.
    #
    # History, because the two numbers below are the edges: at 512m the boot footprint was 467m and
    # the first cycle was OOM-killed roughly every fifteen minutes; at 1g an operator `poll` beside
    # the running service was OOM-killed at 790m RSS on 2026-09-16.
    #
    # 1g fits again because the heavy sources moved out of the process (src/sources/subprocess.ts).
    # Measured on 2026-09-26 in the worst arrangement there is -- an operator `poll` collecting every
    # heavy source beside the running service, each in a child -- the whole cgroup peaked at 684 MB,
    # and the service alone sat at 171 MB and peaked at 300 MB over three minutes at 1 Hz. So this is
    # 1.5x the measured worst case rather than the 3x it was.
    #
    # If this turns out too tight the symptom is `oomKills` in `prod memory`, and the fix is this
    # line. Raise it rather than reasoning about which process the kernel picked.
    mem_limit: 1g
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    env_file:
      - .env
    environment:
      BIND_HOST: 0.0.0.0
      DATABASE_URL: /app/data/app.db
      NODE_ENV: production
      PORT: 8080
    ports:
      - "${SIGNAL_FORGE_BIND_ADDRESS:-127.0.0.1}:18081:8080"
    volumes:
      - ./data:/app/data
      # The nightly backup verifies its own output from inside the container.
      - ./backups:/app/backups
      - ./signal-forge.json:/app/signal-forge.json:ro
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:8080/healthz").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 3
      # The process rebuilds every projection in one transaction before it listens, so it answers
      # some seconds after the container starts: 46s when this was first measured, 9.6s since the
      # story projection stopped copying an array per event. start_period has to cover that with
      # room to spare, or the 2s spacing below stops applying while the app is still booting and
      # detection falls back to the 30s interval -- which is what made one deployment wait 70
      # seconds for a probe that answers in 110 ms.
      start_period: 90s
      # start_interval governs probe spacing until the first success, but only within start_period
      # above. Without it the first probe waits a full interval; with it, readiness is noticed
      # about as soon as it happens -- the probe costs 110 ms, so asking every second is free.
      start_interval: 1s
