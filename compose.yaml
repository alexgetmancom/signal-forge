services:
  app:
    build: .
    image: ${SIGNAL_FORGE_IMAGE:-signal-forge:latest}
    restart: unless-stopped
    mem_limit: 512m
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    env_file:
      - .env
    environment:
      BIND_HOST: 0.0.0.0
      DATABASE_URL: /app/data/app.db
      NODE_ENV: production
      PORT: 8080
    ports:
      - "${SIGNAL_FORGE_BIND_ADDRESS:-127.0.0.1}:18081:8080"
    volumes:
      - ./data:/app/data
      # The nightly backup verifies its own output from inside the container.
      - ./backups:/app/backups
      - ./signal-forge.json:/app/signal-forge.json:ro
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:8080/healthz").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 3
      # The process rebuilds every projection in one transaction before it listens, so it answers
      # some seconds after the container starts: 46s when this was first measured, 9.6s since the
      # story projection stopped copying an array per event. start_period has to cover that with
      # room to spare, or the 2s spacing below stops applying while the app is still booting and
      # detection falls back to the 30s interval -- which is what made one deployment wait 70
      # seconds for a probe that answers in 110 ms.
      start_period: 90s
      # start_interval governs probe spacing until the first success, but only within start_period
      # above. Without it the first probe waits a full interval; with it, readiness is noticed
      # within two seconds of actually happening.
      start_interval: 2s
