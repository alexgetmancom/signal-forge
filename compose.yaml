services:
  app:
    build: .
    image: signal-forge:latest
    restart: unless-stopped
    mem_limit: 512m
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    env_file:
      - .env
    environment:
      BIND_HOST: 0.0.0.0
      DATABASE_URL: /app/data/app.db
      NODE_ENV: production
      PORT: 8080
    ports:
      - "192.168.10.106:18081:8080"
    volumes:
      - ./data:/app/data
      # The nightly backup verifies its own output from inside the container.
      - ./backups:/app/backups
      - ./signal-forge.json:/app/signal-forge.json:ro
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:8080/healthz").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
