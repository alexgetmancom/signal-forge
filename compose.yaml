services:
  app:
    build: .
    image: ${SIGNAL_FORGE_IMAGE:-signal-forge:latest}
    restart: unless-stopped
    mem_limit: 512m
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    env_file:
      - .env
    environment:
      BIND_HOST: 0.0.0.0
      DATABASE_URL: /app/data/app.db
      NODE_ENV: production
      PORT: 8080
    ports:
      - "${SIGNAL_FORGE_BIND_ADDRESS:-127.0.0.1}:18081:8080"
    volumes:
      - ./data:/app/data
      # The nightly backup verifies its own output from inside the container.
      - ./backups:/app/backups
      - ./signal-forge.json:/app/signal-forge.json:ro
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:8080/healthz").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 3
      # Measured on release f2877d1: the process needs 46 seconds between container start and
      # "Signal Forge started", because it rebuilds every projection in one transaction before it
      # listens. start_period has to cover that, or the 2s spacing below stops applying while the
      # app is still booting and detection falls back to the 30s interval -- which is exactly what
      # happened: ready at 22:53:05, reported healthy at 22:53:30.
      start_period: 90s
      # start_interval governs probe spacing until the first success, but only within start_period
      # above. Without it the first probe waits a full interval; with it, readiness is noticed
      # within two seconds of actually happening.
      start_interval: 2s
